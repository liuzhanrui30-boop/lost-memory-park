name: Verify source
on:
  push:
    paths:
      - 'source/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'source/**'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

name: Verify pull request
on:
  pull_request:
    paths:
      - 'source/**'
      - 'index.html'
      - 'AGENTS.md'
      - 'AI_HANDOFF.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - uses: actions/upload-artifact@v4
        with:
          name: lost-memory-park-standalone
          path: source/dist/lost-memory-park.html
          if-no-files-found: error
